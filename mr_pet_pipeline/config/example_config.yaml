# Updated MR-PET Pipeline Configuration
# Supports separate directories for different PET tracers

# =============================================================================
# REQUIRED DIRECTORIES AND TOOLS
# =============================================================================

# Input data directories (BIDS format)
#bids_dir: "/isilon/datalake/riipl/scratch/pipeline/RIIPL_ADSP_pipeline/ADRC/"
bids_dir: "/isilon/datalake/dma_research/original/WisconsinADRC/GLOBUS/2023-11-30_Imaging_Freeze/ADRC/MRI/MRI/"

# PET directories by tracer type (each is optional)
# Set to null to disable a tracer or use structural_only mode
pet_dirs:
  tau: null
  pib: null

# Output directory
output_dir: "/isilon/datalake/riipl/scratch/pipeline/RIIPL_ADSP_pipeline/ADRC/derivatives/pipeline"

# FreeSurfer container and license (REQUIRED)
container_path: "/isilon/datalake/riipl/original/DEMONco/riipl_recon-all-clinical/freesurfer8.0_enhanced.sif"
freesurfer_license: "~/freesurfer_license.txt"

# =============================================================================
# OPTIONAL ENHANCEMENTS (set to null to disable)
# =============================================================================

# Brainnetome atlas for enhanced parcellation (optional)
brainnetome_dir: "/isilon/datalake/riipl/scratch/pipeline/RIIPL_ADSP_pipeline/BN_Atlas_freesurfer/"

# Advanced analysis tools (set to null to disable)
atlas_template_path: null
spm_path: null
c3d_path: null
petpvc_path: null  # Required if run_pvc: true
matlab_scripts_path: null
matlab_module: "matlab/2024b"  # Module to load for MATLAB scripts

# =============================================================================
# PROCESSING SETTINGS
# =============================================================================

# NEW: Structural processing only mode
structural_only: true           # If true, only process MR data (no PET matching/processing)

# Session matching (only used if structural_only: false)
max_age_difference: 5.0          # Maximum age difference for MR-PET matching

# Tracers to process (must have corresponding pet_dirs entries)
# Ignored if structural_only: true
tracers: ["tau", "pib"]           # Can be ["tau"], ["pib"], or ["tau", "pib"]

# Processing features
force_reprocess: false            # If false, skip sessions with existing completed recons
run_additional_modules: true      # WMH, hypothalamic, hippocampal modules
run_brainnetome: true            # Add Brainnetome atlas
run_pvc: false                   # Partial volume correction (requires petpvc_path)

# =============================================================================
# SLURM CONFIGURATION
# =============================================================================

slurm:
  partition: "defq"
  account: "ansir-users"
  
  freesurfer:
    time: "24:00:00"
    memory: "64G"
    cpus: 8
    gpus: 1
  
  pet:
    time: "4:00:00"
    memory: "16G"
    cpus: 4
    gpus: 0

  aggregation:
    time: "2:00:00"
    memory: "8G"
    cpus: 2

# =============================================================================
# OUTPUT AND QC SETTINGS
# =============================================================================

outputs:
  save_qc_images: true
  save_combined_csv: true
  cleanup_temp_files: true

qc:
  generate_qc_images: true

logging:
  level: "INFO"
  save_logs: true

# =============================================================================
# VALIDATION SETTINGS
# =============================================================================

validation:
  require_t1w: true
  require_flair: false  # Changed to false since FLAIR is optional
  min_age: 10
  max_age: 100

# =============================================================================
# EXAMPLE CONFIGURATIONS
# =============================================================================

# Example 1: Structural processing only (no PET)
# structural_only: true
# This will process all MR sessions without requiring PET data

# Example 2: Only process TAU PET
# structural_only: false
# pet_dirs:
#   tau: "/path/to/tau/"
#   pib: null
# tracers: ["tau"]

# Example 3: Only process PIB PET
# structural_only: false
# pet_dirs:
#   tau: null
#   pib: "/path/to/pib/"
# tracers: ["pib"]

# Example 4: Process both (as shown above)
# structural_only: false
# pet_dirs:
#   tau: "/path/to/tau/"
#   pib: "/path/to/pib/"
# tracers: ["tau", "pib"]