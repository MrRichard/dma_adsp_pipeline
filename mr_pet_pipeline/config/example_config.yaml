# Required paths
bids_dir: "/path/to/your/bids_dataset"
output_dir: "/path/to/your/output_directory"
container_path: "/path/to/your/freesurfer_8.0.sif"
freesurfer_license: "/path/to/your/freesurfer_license.txt"

# Path to the python virtual environment with necessary libraries (nibabel, nilearn, etc.)
python_venv_path: "/path/to/your/venv" 

# PET directories by tracer
# List the parent directory for each tracer's BIDS-like structure
pet_dirs:
  tau: "/path/to/tau_pet_data"
  pib: "/path/to/pib_pet_data"

# Processing settings
structural_only: false            # Set to true to only run FreeSurfer
tracers: ["tau", "pib"]           # List of PET tracers to process
max_age_difference: 5.0           # Maximum allowed age difference for MR-PET matching (in years)
force_reprocess: false            # If true, reprocesses sessions that have already completed
require_flair: false              # If true, only processes sessions that have a FLAIR image

# Optional advanced FreeSurfer modules
brainnetome_dir: "/path/to/BN_Atlas_freesurfer" # Directory containing Brainnetome atlas files
run_additional_modules: true      # Run WMH-SynthSeg, hypothalamic, and hippocampal modules
run_brainnetome: true             # Run Brainnetome atlas parcellation
run_pvc: false                    # Run Partial Volume Correction for PET

# PET preprocessing settings
# method: "freesurfer_simple" uses the legacy mri_concat --mean inside the FreeSurfer container
# method: "ants_motion_correction" runs ANTs rigid motion correction + late-frame averaging
# on the host side before the FreeSurfer container, producing a cleaner reference image
pet_preprocessing:
  method: "freesurfer_simple"    # "freesurfer_simple" or "ants_motion_correction"
  ants_module: "ants/2.5.1"      # Module to load for ANTs on the HPC host
  fsl_module: "fsl/6.0.7.4"      # Module to load for FSL on the HPC host
  late_frame_count: 4            # Number of late frames to average (PiB protocol)
  use_json_metadata: true        # Parse PET sidecar JSON for tracer metadata

# SLURM job settings
slurm:
  partition: "defq"               # SLURM partition for job submission
  account: "your_account"         # SLURM account name
  
  # Resource allocation for the main FreeSurfer job
  freesurfer:
    time: "24:00:00"              # Max runtime (HH:MM:SS)
    memory: "64G"                 # Memory allocation (e.g., 64G, 128000M)
    cpus: 8                       # Number of CPUs per task
    gpus: 1                       # Number of GPUs (optional, set to 0 if not needed)

  # Resource allocation for PET processing jobs
  pet:
    time: "4:00:00"
    memory: "16G"
    cpus: 4
